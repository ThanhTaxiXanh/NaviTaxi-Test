name: Gis 34 province REVIEW APK (DEBUG ONLY, NOT P0)

on:
  push:
    branches: [main]
    paths:
      - 'lib/app/app.dart'
      - 'lib/features/map/review_map_screen.dart'
      - 'lib/features/map/review_map_data.dart'
      - 'lib/features/map/review_maplibre_screen.dart'
      - 'lib/features/offline/pmtiles_v3.dart'
      - 'lib/features/offline/offline_mvt_server.dart'
      - 'lib/features/offline/offline_packages_screen.dart'
      - 'lib/platform/android_storage_bridge.dart'
      - 'android/app/src/main/kotlin/vn/navitaxi/navi_taxi_test/OfflinePackageStore.kt'
      - 'android/app/src/debug/AndroidManifest.xml'
      - 'test/pmtiles_v3_test.dart'
      - 'test/review_local_mvt_style_test.dart'
      - 'lib/features/map/review_label_anchors.dart'
      - 'lib/features/map/admin_catalog.dart'
      - 'lib/features/map/admin_search_delegate.dart'
      - 'test/admin_catalog_test.dart'
      - 'assets/geo/provinces_wards_v5_2.json'
      - 'pipeline/build_admin_label_anchors.py'
      - 'pubspec.yaml'
      - 'test/review_label_anchors_test.dart'
      - 'lib/features/map/review_maplibre_style.dart'
      - 'test/review_maplibre_style_test.dart'
      - 'test/review_maplibre_asset_test.dart'
      - 'assets/review/preview_geometry.b64'
      - 'test/review_map_data_test.dart'
      - '.github/workflows/gis-review-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/app/app.dart'
      - 'lib/features/map/review_map_screen.dart'
      - 'lib/features/map/review_map_data.dart'
      - 'lib/features/map/review_maplibre_screen.dart'
      - 'lib/features/offline/pmtiles_v3.dart'
      - 'lib/features/offline/offline_mvt_server.dart'
      - 'lib/features/offline/offline_packages_screen.dart'
      - 'lib/platform/android_storage_bridge.dart'
      - 'android/app/src/main/kotlin/vn/navitaxi/navi_taxi_test/OfflinePackageStore.kt'
      - 'android/app/src/debug/AndroidManifest.xml'
      - 'test/pmtiles_v3_test.dart'
      - 'test/review_local_mvt_style_test.dart'
      - 'lib/features/map/review_label_anchors.dart'
      - 'lib/features/map/admin_catalog.dart'
      - 'lib/features/map/admin_search_delegate.dart'
      - 'test/admin_catalog_test.dart'
      - 'assets/geo/provinces_wards_v5_2.json'
      - 'pipeline/build_admin_label_anchors.py'
      - 'pubspec.yaml'
      - 'test/review_label_anchors_test.dart'
      - 'lib/features/map/review_maplibre_style.dart'
      - 'test/review_maplibre_style_test.dart'
      - 'test/review_maplibre_asset_test.dart'
      - 'assets/review/preview_geometry.b64'
      - '.github/workflows/gis-review-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-private-review-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Generate Android scaffolding and resolve plugins
        run: |
          flutter create --platforms=android --project-name=navi_taxi_test --org=vn.navitaxi .
          rm -f test/widget_test.dart
          flutter pub get
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Derive offline label anchors from pinned GIS archive (review only)
        run: |
          python3 -m pip install --quiet shapely==2.1.2
          curl --fail --location --show-error --silent --retry 3 --retry-all-errors --max-time 300 \
            --output "$RUNNER_TEMP/vn_provinces_wards_geojson.zip" \
            "https://raw.githubusercontent.com/thanglequoc/vietnamese-provinces-database/8b78ba5118715e1fa81769286724db79346abf52/json/vn_provinces_wards_geojson.zip"
          python3 pipeline/build_admin_label_anchors.py \
            --zip "$RUNNER_TEMP/vn_provinces_wards_geojson.zip" \
            --names assets/geo/provinces_wards_v5_2.json \
            --output assets/geo/ward_label_anchors.json \
            --report build/qa/administrative-labels-review.json
      - name: Verify all Flutter tests and analysis
        run: |
          # Flutter stable 3.47 surfaces framework-wide material.dart deprecation infos.
          # Keep errors and warnings fatal, but do not block debug APK on infos.
          flutter analyze --no-fatal-infos
          flutter test --dart-define=NAVITAXI_ADMIN_ANCHORS_INCLUDED=true
      - name: Build strictly debug REVIEW APK, P0 stays BLOCKED
        run: flutter build apk --debug --dart-define=NAVITAXI_REVIEW_MODE=true
      - name: Package distinct reviewer APK
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/NaviTaxi_GIS_34Tinh_REVIEW_DEBUG_NOT_P0.apk
          sha256sum build/app/outputs/flutter-apk/NaviTaxi_GIS_34Tinh_REVIEW_DEBUG_NOT_P0.apk > build/app/outputs/flutter-apk/REVIEW_APK_SHA256.txt
      - name: Upload GIS review APK for manual phone inspection
        uses: actions/upload-artifact@v4
        with:
          name: NaviTaxi-GIS-34Tinh-REVIEW-DEBUG-APK-NOT-P0
          path: |
            build/app/outputs/flutter-apk/NaviTaxi_GIS_34Tinh_REVIEW_DEBUG_NOT_P0.apk
            build/app/outputs/flutter-apk/REVIEW_APK_SHA256.txt
            build/qa/administrative-labels-review.json
          retention-days: 14
          if-no-files-found: error
