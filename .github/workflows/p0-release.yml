name: P0 release blocker

on:
  workflow_dispatch:

jobs:
  block-unverified-map-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python pipeline/vietnam_sovereignty_validator.py --repo-root . --mode release
