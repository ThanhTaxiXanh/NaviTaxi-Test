name: Android foundation checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/sovereignty -v
      - name: Confirm unapproved release is blocked
        run: |
          if python pipeline/vietnam_sovereignty_validator.py --repo-root . --mode release; then
            echo "Unexpected P0 PASS from incomplete pipeline" >&2
            exit 1
          fi

  flutter-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Flutter platform support files
        run: flutter create --platforms=android --project-name=navi_taxi_test --org=vn.navitaxi .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
