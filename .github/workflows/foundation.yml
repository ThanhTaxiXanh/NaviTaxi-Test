name: Android foundation checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/sovereignty -v
      - name: Report risk-based territorial map acceptance gaps (not P0)
        run: python -m pipeline.map_display_acceptance --output build/qa/map-acceptance-review.json
      - name: Archive read-only territorial review status
        uses: actions/upload-artifact@v4
        with:
          name: navitaxi-map-acceptance-review-NOT-P0
          path: build/qa/map-acceptance-review.json
          if-no-files-found: error
          retention-days: 7
      - name: Confirm unapproved release is blocked
        run: |
          if python pipeline/vietnam_sovereignty_validator.py --repo-root . --mode release; then
            echo "Unexpected P0 PASS from incomplete pipeline" >&2
            exit 1
          fi

  flutter-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Flutter platform support files
        run: flutter create --platforms=android --project-name=navi_taxi_test --org=vn.navitaxi .
      - name: Remove Flutter's generated template test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - name: Archive development APK (not a P0-approved release)
        uses: actions/upload-artifact@v4
        with:
          name: navitaxi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  native-gis-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile optional native structural scanner
        run: |
          g++ --version
          g++ -std=c++17 -O2 tools/native_mvt_scan.cpp -lz -o /tmp/navitaxi-native-mvt-scan
      - name: Verify scanner provenance and fail-closed synthetic PMTiles tests
        env:
          NATIVE_MVT_SCANNER: /tmp/navitaxi-native-mvt-scan
        run: python -m unittest discover -s tests/native -v
